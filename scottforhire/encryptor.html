<!DOCTYPE html>
<html>
<head>
    <title>Portfolio Encryptor V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white p-10 font-mono">
<h1 class="text-2xl mb-4 text-sky-400 font-bold">Encryption Tool (Verified)</h1>

<div class="space-y-4 max-w-4xl mx-auto">
    <div>
        <label class="block mb-2 font-bold">1. Paste your Portfolio HTML here:</label>
        <textarea id="content" class="w-full h-48 bg-slate-800 p-4 rounded border border-slate-700 text-sm focus:border-sky-500 focus:outline-none transition-colors" placeholder="<section>...</section>"></textarea>
    </div>

    <div class="bg-slate-800 p-4 rounded border border-slate-700">
        <label class="block mb-2 font-bold text-sky-400">2. Set Encryption Password:</label>
        <div class="relative">
            <input type="password" id="password" value="hire_scott!!"
                   class="w-full bg-slate-900 p-3 rounded border border-slate-600 text-white font-bold tracking-wider focus:border-sky-500 focus:outline-none">

            <button type="button" onclick="togglePassword()" class="absolute right-3 top-3 text-slate-400 hover:text-white">
                <i class="fas fa-eye" id="eye-icon"></i>
            </button>
        </div>
        <p class="text-xs text-slate-400 mt-2">
            <i class="fas fa-triangle-exclamation text-yellow-500"></i>
            Make sure there are no spaces at the end!
        </p>
    </div>

    <button onclick="encryptData()" class="bg-sky-600 hover:bg-sky-500 text-white px-6 py-3 rounded font-bold w-full transition-colors shadow-lg shadow-sky-900/50">
        <i class="fas fa-lock mr-2"></i> ENCRYPT NOW
    </button>

    <div id="resultBox" class="hidden border-t border-slate-700 pt-6 mt-6">
        <label class="block mb-2 text-green-400 font-bold text-xl">3. SUCCESS! Copy this new code:</label>
        <textarea id="output" class="w-full h-32 bg-black text-green-500 p-4 rounded border border-green-700 text-xs mb-2 font-mono" readonly></textarea>
        <button onclick="copyToClipboard(this)" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded text-sm font-bold w-full border border-slate-600">
            <i class="fas fa-copy"></i> Copy JSON
        </button>
    </div>
</div>

<script>
    function togglePassword() {
        const pwd = document.getElementById('password');
        const icon = document.getElementById('eye-icon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            pwd.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    async function encryptData() {
        const content = document.getElementById('content').value;
        const password = document.getElementById('password').value;

        if(!content) return alert("Please paste the HTML content first.");
        if(!password) return alert("Please enter a password.");

        try {
            const enc = new TextEncoder();
            const salt = crypto.getRandomValues(new Uint8Array(16)); // Random Salt
            const iv = crypto.getRandomValues(new Uint8Array(12));   // Random IV

            // Derive Key (PBKDF2)
            const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
            const key = await crypto.subtle.deriveKey(
                { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt"]
            );

            // Encrypt Content
            const encryptedContent = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(content));

            // Convert to Base64
            const bufferToBase64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

            const payload = {
                salt: bufferToBase64(salt),
                iv: bufferToBase64(iv),
                data: bufferToBase64(encryptedContent)
            };

            document.getElementById('resultBox').classList.remove('hidden');
            document.getElementById('output').value = JSON.stringify(payload);
        } catch (e) {
            alert("Encryption Error: " + e.message);
        }
    }

    function copyToClipboard(btn) {
        const output = document.getElementById('output');
        output.select();
        document.execCommand('copy');
        btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
        setTimeout(() => btn.innerHTML = '<i class="fas fa-copy"></i> Copy JSON', 2000);
    }
</script>
</body>
</html>
